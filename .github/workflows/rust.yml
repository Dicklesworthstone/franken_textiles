name: Rust checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record source under test
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - name: Preserve the exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Package pinned tools for offline reproduction
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[offline-tools]')) }}
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f1)"
          tar --exclude='*/share/doc' -czf "$RUNNER_TEMP/rust-tools.tar.gz" -C "$HOME" ".rustup/toolchains/$toolchain" .cargo/bin .cargo/registry
      - name: Preserve offline tools
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[offline-tools]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-tools-${{ github.sha }}
          path: ${{ runner.temp }}/rust-tools.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Check capture and manufacturing workflows
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get -o Acquire::http::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" -o Acquire::https::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" update
          sudo apt-get -o Acquire::http::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" -o Acquire::https::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
          cargo test -p ftx-cli --bin ftx --locked video_decode::tests
          cargo test -p ftx-cli --test video_decode_workflow --locked -- --include-ignored
          cargo test -p ftx-cli --test video_masks_workflow --locked
          node --test tools/check_video_masks_frontend.cjs
          cargo test -p ftx-cli --test body_fit_workflow --locked
          cargo test -p ftx-export --test cutting --test cutting_job --test sewing_consumables --locked
      - name: Test
        if: ${{ !cancelled() }}
        env:
          FTX_MOTION_REPLAY: ${{ runner.temp }}/ftx-motion-replay
          FTX_COUPLED_WATER_REPLAY: ${{ runner.temp }}/ftx-coupled-water-replay
          FTX_SUPPLIED_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-water-replay
          FTX_CONDENSED_WATER_REPLAY: ${{ runner.temp }}/ftx-condensed-water-replay
          FTX_VARIABLE_WATER_REPLAY: ${{ runner.temp }}/ftx-variable-water-replay
          FTX_EVAPORATING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-evaporating-mechanics-replay
          FTX_MECHANICAL_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-mechanics-replay
          FTX_CONDENSING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-condensing-mechanics-replay
          FTX_ROUTED_FIXTURE_REPLAY: ${{ runner.temp }}/ftx-routed-fixture-replay
          FTX_CONSUMER_ADAPTIVE_CAPTURE_DIR: ${{ runner.temp }}/ftx-consumer-adaptive-replay
          FTX_MOVING_BRIDGES_REPLAY: ${{ runner.temp }}/ftx-moving-bridges-replay
        run: cargo test --workspace --locked
      - name: Test supplier source adapters
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test*.py' -v
      - name: Check browser bindings
        if: ${{ !cancelled() }}
        run: cargo check --target wasm32-unknown-unknown -p ftx-wasm --locked
      - name: Check tracing page and worker state
        if: ${{ !cancelled() }}
        run: node --experimental-vm-modules --test tools/check_trace_frontend.cjs
      - name: Build requested browser bundle
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-bundle]')) }}
        env:
          FTX_MOTION_REPLAY: ${{ runner.temp }}/ftx-motion-replay
          FTX_COUPLED_WATER_REPLAY: ${{ runner.temp }}/ftx-coupled-water-replay
          FTX_SUPPLIED_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-water-replay
          FTX_CONDENSED_WATER_REPLAY: ${{ runner.temp }}/ftx-condensed-water-replay
          FTX_VARIABLE_WATER_REPLAY: ${{ runner.temp }}/ftx-variable-water-replay
          FTX_EVAPORATING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-evaporating-mechanics-replay
          FTX_MECHANICAL_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-mechanics-replay
          FTX_CONDENSING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-condensing-mechanics-replay
          FTX_ROUTED_FIXTURE_REPLAY: ${{ runner.temp }}/ftx-routed-fixture-replay
          FTX_CONSUMER_ADAPTIVE_REPLAY: ${{ runner.temp }}/ftx-consumer-adaptive-replay
          FTX_MOVING_BRIDGES_REPLAY: ${{ runner.temp }}/ftx-moving-bridges-replay
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          sh tools/build_web.sh
          FTX_REAL_WASM=1 node --experimental-vm-modules --test tools/check_materials_frontend.cjs tools/check_design_worst_case_frontend.cjs
      - name: Preserve browser bundle
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-bundle]')
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: web/
          retention-days: 1
