name: Rust checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material_heat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check coupled motion and material heating
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ftx-export --lib --locked material_study::comparison::surface_water::tests
          cargo test -p ftx-export --lib --locked material_study::comparison::heating_tests
          cargo test -p ftx-export --test scenario_comparison --locked
          cargo test -p ftx-wasm --test material_scenario --locked relaxation_heating::distinct_material_heat_fractions_share_one_maxwell_law_in_comparison -- --exact
          cargo test -p ftx-wasm --test material_scenario --locked surface_water::distinct_initial_temperatures_reach_heated_sheet_and_coverage_decisions -- --exact
          cargo test -p ftx-drape --test thermal_coverage_exterior --locked
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record source under test
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - name: Preserve the exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Package pinned tools for offline reproduction
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[offline-tools]')) }}
        run: |
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f1)"
          tar --exclude='*/share/doc' -czf "$RUNNER_TEMP/rust-tools.tar.gz" -C "$HOME" ".rustup/toolchains/$toolchain" .cargo/bin .cargo/registry
      - name: Preserve offline tools
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[offline-tools]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-tools-${{ github.sha }}
          path: ${{ runner.temp }}/rust-tools.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Check capture and manufacturing workflows
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get -o Acquire::http::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" -o Acquire::https::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" update
          sudo apt-get -o Acquire::http::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" -o Acquire::https::User-Agent="OpenAI File Downloader, XaiImageApiFetch/1.0" install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
          cargo test -p ftx-cli --bin ftx --locked video_decode::tests
          cargo test -p ftx-cli --test video_decode_workflow --locked -- --include-ignored
          cargo test -p ftx-cli --test video_masks_workflow --locked
          node --test tools/check_video_masks_frontend.cjs
          cargo test -p ftx-cli --test body_fit_workflow --locked
          cargo test -p ftx-export --test cutting --test cutting_job --test sewing_consumables --locked
          cargo test -p ftx-pattern --test material_catalog --locked
          cargo test -p ftx-export --test cutting_program --test finite_cutting_program --test sewing --test sewing_assembly --test sewing_pressure --locked
          cargo test -p ftx-export --lib --locked material_study::cutting_effort::tests
          FTX_FINITE_KNIFE_REPLAY="$RUNNER_TEMP/ftx-finite-knife-replay" cargo test -p ftx-cli --test finite_stock_workflow --locked qualified_finite_and_mixed_knife_programs_replay_through_both_binaries
      - name: Test
        if: ${{ !cancelled() }}
        env:
          FTX_MOTION_REPLAY: ${{ runner.temp }}/ftx-motion-replay
          FTX_COUPLED_WATER_REPLAY: ${{ runner.temp }}/ftx-coupled-water-replay
          FTX_COUPLED_WATER_ALTERNATIVES_REPLAY: ${{ runner.temp }}/ftx-paired-water-replay
          FTX_SUPPLIED_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-water-replay
          FTX_CONDENSED_WATER_REPLAY: ${{ runner.temp }}/ftx-condensed-water-replay
          FTX_VARIABLE_WATER_REPLAY: ${{ runner.temp }}/ftx-variable-water-replay
          FTX_DEPTH_PROFILE_WATER_REPLAY: ${{ runner.temp }}/ftx-depth-profile-water-replay
          FTX_EVAPORATING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-evaporating-mechanics-replay
          FTX_MECHANICAL_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-mechanics-replay
          FTX_CONDENSING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-condensing-mechanics-replay
          FTX_INCOMING_WATER_IMPULSE_REPLAY: ${{ runner.temp }}/ftx-incoming-water-impulse-replay
          FTX_CONDENSING_IMPULSE_REPLAY: ${{ runner.temp }}/ftx-condensing-impulse-replay
          FTX_KNIFE_PROGRAM_REPLAY: ${{ runner.temp }}/ftx-knife-program-replay
          FTX_FINITE_KNIFE_REPLAY: ${{ runner.temp }}/ftx-finite-knife-replay
          FTX_ROUTED_FIXTURE_REPLAY: ${{ runner.temp }}/ftx-routed-fixture-replay
          FTX_CONSUMER_ADAPTIVE_CAPTURE_DIR: ${{ runner.temp }}/ftx-consumer-adaptive-replay
          FTX_CUT_AND_SEW_REPLAY: ${{ runner.temp }}/ftx-cut-and-sew-replay
          FTX_MOVING_BRIDGES_REPLAY: ${{ runner.temp }}/ftx-moving-bridges-replay
        run: cargo test --workspace --locked
      - name: Test supplier source adapters
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts -p 'test*.py' -v
      - name: Build browser bindings (wasm32 release)
        if: ${{ !cancelled() }}
        run: cargo build --locked --release --target wasm32-unknown-unknown -p ftx-wasm
      - name: Check all 9 pure-Node VM frontend and worker suites
        if: ${{ !cancelled() }}
        run: node --experimental-vm-modules --test tools/check_trace_frontend.cjs tools/check_material_screen_builder.cjs
      - name: Build and verify browser bundle (all 19 VM, WASM, and Playwright suites)
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-bundle]')) }}
        env:
          FTX_MOTION_REPLAY: ${{ runner.temp }}/ftx-motion-replay
          FTX_COUPLED_WATER_REPLAY: ${{ runner.temp }}/ftx-coupled-water-replay
          FTX_COUPLED_WATER_ALTERNATIVES_REPLAY: ${{ runner.temp }}/ftx-paired-water-replay
          FTX_GUIDED_SCENARIO_NATIVE: ${{ github.workspace }}/target/release/ftx-materials
          FTX_SUPPLIED_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-water-replay
          FTX_CONDENSED_WATER_REPLAY: ${{ runner.temp }}/ftx-condensed-water-replay
          FTX_VARIABLE_WATER_REPLAY: ${{ runner.temp }}/ftx-variable-water-replay
          FTX_DEPTH_PROFILE_WATER_REPLAY: ${{ runner.temp }}/ftx-depth-profile-water-replay
          FTX_EVAPORATING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-evaporating-mechanics-replay
          FTX_MECHANICAL_WATER_REPLAY: ${{ runner.temp }}/ftx-supplied-mechanics-replay
          FTX_CONDENSING_MECHANICS_REPLAY: ${{ runner.temp }}/ftx-condensing-mechanics-replay
          FTX_INCOMING_WATER_IMPULSE_REPLAY: ${{ runner.temp }}/ftx-incoming-water-impulse-replay
          FTX_CONDENSING_IMPULSE_REPLAY: ${{ runner.temp }}/ftx-condensing-impulse-replay
          FTX_KNIFE_PROGRAM_REPLAY: ${{ runner.temp }}/ftx-knife-program-replay
          FTX_FINITE_KNIFE_REPLAY: ${{ runner.temp }}/ftx-finite-knife-replay
          FTX_ROUTED_FIXTURE_REPLAY: ${{ runner.temp }}/ftx-routed-fixture-replay
          FTX_CONSUMER_ADAPTIVE_REPLAY: ${{ runner.temp }}/ftx-consumer-adaptive-replay
          FTX_CUT_AND_SEW_REPLAY: ${{ runner.temp }}/ftx-cut-and-sew-replay
          FTX_MOVING_BRIDGES_REPLAY: ${{ runner.temp }}/ftx-moving-bridges-replay
          NPM_CONFIG_USER_AGENT: "OpenAI File Downloader, XaiImageApiFetch/1.0"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          mkdir -p "$RUNNER_TEMP/ftx-playwright"
          npm --prefix "$RUNNER_TEMP/ftx-playwright" install --no-save --no-audit --no-fund playwright@1.57.0
          NODE_PATH="$RUNNER_TEMP/ftx-playwright/node_modules" "$RUNNER_TEMP/ftx-playwright/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/ftx-playwright/node_modules" sh tools/check_all_web.sh
      - name: Preserve browser bundle
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-bundle]')
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ github.sha }}
          path: web/
          retention-days: 1
