name: ChArUco photo conformance

on:
  push:
    branches: [main]
    paths:
      - 'crates/ftx-cli/**'
      - 'crates/ftx-measure/**'
      - 'crates/ftx-trace/**'
      - 'tools/photo/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/photo-charuco.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the optional local detector
        run: python -m pip install opencv-python-headless==4.13.0.92
      - name: Synthetic pixel and physical-ID conformance
        run: python tools/photo/test_charuco_detector.py
      - name: Rust scale and evidence gates
        run: cargo test --locked -p ftx-measure --test photo --test charuco_evidence --test photo_lens
      - name: Calibration, ChArUco and plain-sheet end-to-end workflows
        run: cargo test --locked -p ftx-cli --test camera_image_workflow --test camera_calibration_workflow --test photo_charuco_workflow --test photo_image_workflow --test photo_workflow -- --include-ignored
      - name: Blur diagnostic unit tests
        run: cargo test --locked -p ftx-cli --bin ftx charuco_image
      - name: Image calibration partition and evidence tests
        run: cargo test --locked -p ftx-cli --bin ftx calibration_images
