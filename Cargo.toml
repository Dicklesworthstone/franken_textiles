[workspace]
resolver = "3"
members = ["crates/ftx-core", "crates/ftx-body", "crates/ftx-pattern", "crates/ftx-measure", "crates/ftx-drape", "crates/ftx-export", "crates/ftx-trace", "crates/ftx-cli", "crates/ftx-wasm", "crates/ftx-conformance"]

# Workspace crates (plan §16 / AGENTS.md "Workspace Crates"). No crate outside this list
# without explicit maintainer approval; arbitrary line-count ceilings are retired.
# - crates/ftx-core        units, deterministic math, geometry kernels, PyJson/text/pole, schemas, refusals
# - crates/ftx-pattern     pattern model, instances, validation, alteration, drafting, material catalog
# - crates/ftx-body        Anny forward model, measurement slicing, fitting, poses, landmarks
# - crates/ftx-measure     catalogue, priors, fusion, readiness, photo scale, photogrammetry
# - crates/ftx-drape       garment meshing, IPC contact cloth solver, multiphysics transport, metrics/flags
# - crates/ftx-export      SVG, PDF, DXF, HPGL, cutter, GarmentCode, DST, manufacturing planners & checks
# - crates/ftx-trace       tracing pattern sheets, printable calibration references, raster decoders
# - crates/ftx-cli         the `ftx` and `ftx-materials` binaries
# - crates/ftx-wasm        browser bindings for the local `web/` workbenches
# - crates/ftx-conformance oracle fixtures, differential, property and determinism tests

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["FrankenTextiles Contributors"]
repository = "https://github.com/Dicklesworthstone/franken_textiles"
homepage = "https://github.com/Dicklesworthstone/franken_textiles"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

[workspace.dependencies]
# Small, pinned allowlist (plan §15). Serialization for files and manifests only,
# never inside a solver iteration.
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
# `float_roundtrip`: correctly rounded float parsing. Without it serde_json may read a decimal one ULP
# off, which flipped point-in-polygon verdicts for points on a vertex in the oracle fixtures.
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip"] }
# Constrained Delaunay for garment meshing (plan §11.4, on the allowlist). 2.15.1 with `std`; pulls
# hashbrown, num-traits, robust (adaptive exact predicates) and smallvec. Only the CDT insertion and
# inner-face iteration are used (deterministic for a fixed insertion order); its hash sets serve the
# flood fill, which we do not call.
spade = { version = "=2.15.1", default-features = false, features = ["std"] }
# DEFLATE for PDF content streams (written FlateDecode, read back by the export checks; spec 03 §7.2, §8.3).
# 0.8.9 with its default `with-alloc`; pulls only adler2. Pure Rust, builds for wasm32. Used:
# deflate::compress_to_vec_zlib and inflate::decompress_to_vec_zlib. It also sits under the PNG decoding
# the plan allows for tracing.
miniz_oxide = { version = "=0.8.9" }
# The browser boundary, in ftx-wasm only and only for wasm32 (plan §15–16): #[wasm_bindgen] on functions
# taking and returning strings, a struct returning Vec<u8>, and JsError. Pinned to the installed
# wasm-bindgen CLI (0.2.128), which must match it exactly; pulls wasm-bindgen-macro/-shared/-backend and
# once_cell. Native builds do not compile it.
wasm-bindgen = { version = "=0.2.128" }

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
