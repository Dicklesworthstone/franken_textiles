[package]
name = "ftx-cli"
default-run = "ftx"
description = "FrankenTextiles command line: validate patterns and drape them on a body (the skill calls `ftx`)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ftx"
path = "src/main.rs"

[dependencies]
ftx-body = { path = "../ftx-body" }
ftx-core = { path = "../ftx-core" }
ftx-drape = { path = "../ftx-drape" }
ftx-export = { path = "../ftx-export" }
ftx-measure = { path = "../ftx-measure" }
ftx-pattern = { path = "../ftx-pattern" }
ftx-trace = { path = "../ftx-trace" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
