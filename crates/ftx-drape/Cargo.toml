[package]
name = "ftx-drape"
description = "FrankenTextiles drape: an implicit cloth solver (orthotropic membrane, quadratic bending, projected Newton on a sparse LDLT) for sewing patterns onto bodies"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ftx-body = { path = "../ftx-body" }
ftx-core = { path = "../ftx-core" }
ftx-pattern = { path = "../ftx-pattern" }
miniz_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true
spade.workspace = true
rayon = { workspace = true, optional = true }

[features]
# Element, energy and contact-pair evaluation on rayon's pool (src/par.rs). Off by default: library
# users get no thread pool unless they ask. Results are bit-identical with and without it.
parallel = ["dep:rayon"]

[lints]
workspace = true
