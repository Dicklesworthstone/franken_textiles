[package]
name = "ftx-wasm"
description = "FrankenTextiles in the browser: the page's round (body, draft, flat checks, measurement gate, exports, zip) and the fold-up on a fitted body, behind a thin wasm-bindgen boundary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ftx-body = { path = "../ftx-body" }
ftx-core = { path = "../ftx-core" }
ftx-drape = { path = "../ftx-drape" }
ftx-export = { path = "../ftx-export" }
ftx-measure = { path = "../ftx-measure" }
ftx-pattern = { path = "../ftx-pattern" }
ftx-trace = { path = "../ftx-trace" }
miniz_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
